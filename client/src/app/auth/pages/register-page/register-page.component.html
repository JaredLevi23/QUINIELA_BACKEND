<div class="card elev-md" style="width:min(380px,100%); padding:36px;">
  <div class="card-kicker">Quiniela Amigos</div>
  <h2 style="margin:6px 0 24px;">Crear cuenta</h2>

  <form [formGroup]="registerForm" (ngSubmit)="register()" autocomplete="off">

    <div class="field mt-3">
      <label for="name">Nombre</label>
      <input id="name" type="text" formControlName="name" placeholder="Tu nombre" class="input">
      <div class="field-error" *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
        El nombre es requerido
      </div>
    </div>

    <div class="field mt-3">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" placeholder="tucorreo@ejemplo.com" class="input">
      <div class="field-error" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
        Ingresa un correo válido
      </div>
    </div>

    <div class="field mt-3">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="••••••••" class="input">
      <div class="field-error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
        Mínimo 6 caracteres
      </div>
    </div>

    <button class="btn btn-primary btn-block mt-4" type="submit">Crear cuenta</button>
  </form>

  <p class="text-muted mt-4" style="text-align:center; font-size:13px;">
    ¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a>
  </p>
</div>
