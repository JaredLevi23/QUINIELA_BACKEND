<div class="card elev-md" style="width:min(380px,100%); padding:36px;">
  <div class="card-kicker">Quiniela Amigos</div>
  <h2 style="margin:6px 0 24px;">Iniciar sesión</h2>

  <form [formGroup]="loginForm" (ngSubmit)="login()" autocomplete="off">

    <div class="field mt-3">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" placeholder="tucorreo@ejemplo.com" class="input">
    </div>

    <div class="field mt-3">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="••••••••" class="input">
    </div>

    <button class="btn btn-primary btn-block mt-4" type="submit" [disabled]="loginForm.invalid">Entrar</button>
  </form>

  <p class="text-muted mt-4" style="text-align:center; font-size:13px;">
    ¿No tienes cuenta? <a routerLink="/auth/register">Crear una aquí</a>
  </p>
</div>
