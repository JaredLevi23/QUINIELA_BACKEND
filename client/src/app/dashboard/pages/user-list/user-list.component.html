<h1>Usuarios</h1>

<div class="flex gap-3 flex-wrap mt-4" style="max-width:560px;">
  <div style="flex:1; min-width:220px;">
    <shared-search-box placeholder="Buscar usuario" (onValue)="search($event)"></shared-search-box>
  </div>
  <select class="input" style="max-width:160px;" (change)="filterByRole($any($event.target).value)">
    <option value="">Todos los roles</option>
    <option value="admin">Admin</option>
    <option value="moderator">Moderador</option>
    <option value="user">Usuario</option>
  </select>
</div>

<div *ngIf="filteredUsers().length > 0; else noUsers" class="mt-4">
  <div class="only-desktop table-scroll">
    <table class="table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Rol</th>
          <th>Habilitado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers()">
          <td>{{ user.name }} {{ user.lastname }}</td>
          <td>{{ user.email }}</td>
          <td><span class="tag tag-outline">{{ user.role }}</span></td>
          <td>
            <span class="tag" [ngClass]="user.enabled ? 'tag-accent' : 'tag-neutral'">
              {{ user.enabled ? 'Sí' : 'No' }}
            </span>
          </td>
          <td>
            <button class="btn btn-secondary btn-sm" (click)="editUser(user.uid)">Editar</button>
            <button class="btn btn-secondary btn-sm" (click)="toggleEnabled(user.uid, user.enabled)">
              {{ user.enabled ? 'Desactivar' : 'Activar' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="only-mobile flex-col gap-3">
    <div class="card elev-sm" *ngFor="let user of filteredUsers()">
      <div class="flex-between">
        <strong>{{ user.name }} {{ user.lastname }}</strong>
        <span class="tag" [ngClass]="user.enabled ? 'tag-accent' : 'tag-neutral'">
          {{ user.enabled ? 'Activo' : 'Inactivo' }}
        </span>
      </div>
      <p class="card-body" style="margin:4px 0 0;">{{ user.email }}</p>
      <span class="tag tag-outline mt-2" style="align-self:flex-start;">{{ user.role }}</span>
      <div class="flex gap-2 mt-3" style="justify-content:center;">
        <button class="btn btn-secondary btn-sm" (click)="editUser(user.uid)">Editar</button>
        <button class="btn btn-secondary btn-sm" (click)="toggleEnabled(user.uid, user.enabled)">
          {{ user.enabled ? 'Desactivar' : 'Activar' }}
        </button>
      </div>
    </div>
  </div>
</div>

<ng-template #noUsers>
  <p class="text-muted mt-4">No hay usuarios registrados</p>
</ng-template>
