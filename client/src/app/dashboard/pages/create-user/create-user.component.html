<h1>{{ isEditMode ? 'Editar usuario' : 'Crear usuario' }}</h1>

<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="mt-4" style="max-width:420px;">

  <div class="field mt-3">
    <label for="name">Nombre</label>
    <input id="name" formControlName="name" class="input" />
    <div *ngIf="f['name'].touched && f['name'].invalid" class="field-error">El nombre es requerido.</div>
  </div>

  <div class="field mt-3">
    <label for="lastname">Apellido</label>
    <input id="lastname" formControlName="lastname" class="input" />
    <div *ngIf="f['lastname'].touched && f['lastname'].invalid" class="field-error">El apellido es requerido.</div>
  </div>

  <div class="field mt-3">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" formControlName="email" class="input" />
    <div *ngIf="f['email'].touched && f['email'].invalid" class="field-error">Ingresa un correo válido.</div>
  </div>

  <div class="field mt-3" *ngIf="!isEditMode">
    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" class="input" />
    <div *ngIf="f['password'].touched && f['password'].invalid" class="field-error">Mínimo 6 caracteres.</div>
  </div>

  <div class="field mt-3">
    <label for="role">Rol</label>
    <select id="role" formControlName="role" class="input">
      <option value="user">Usuario</option>
      <option value="moderator">Moderador</option>
      <option value="admin">Administrador</option>
    </select>
  </div>

  <label class="flex gap-2 mt-3" style="align-items:center; font-size:14px;" *ngIf="isEditMode">
    <input type="checkbox" class="check" formControlName="enabled" /> Habilitado
  </label>

  <button type="submit" class="btn btn-primary mt-4" [disabled]="userForm.invalid">
    {{ isEditMode ? 'Actualizar usuario' : 'Crear usuario' }}
  </button>
</form>
